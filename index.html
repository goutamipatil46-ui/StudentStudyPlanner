<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📚 Student Study Planner</h1>
    <p>Plan your studies. Track your progress. Achieve your goals.</p>
  </header>

  <main class="container">
    <section class="welcome">
      <h2>Welcome, Student!</h2>
      <p>Organize your daily study activities in one place.</p>
    </section>

    <section class="stats" aria-label="Task statistics">
      <div class="stat-card"><h3 id="totalTasks">0</h3><p>Total Tasks</p></div>
      <div class="stat-card"><h3 id="completedTasks">0</h3><p>Completed</p></div>
      <div class="stat-card"><h3 id="pendingTasks">0</h3><p>Pending</p></div>
    </section>

    <section class="panel">
      <h2>Add a Study Task</h2>
      <form id="taskForm">
        <label for="taskName">Task Name</label>
        <input type="text" id="taskName" placeholder="e.g. Study Python" required maxlength="120">
        <label for="subject">Subject</label>
        <select id="subject" required>
          <option value="">Select subject</option>
          <option>Python</option><option>DBMS</option><option>Machine Learning</option>
          <option>Data Structures</option><option>Cloud Computing</option><option>Other</option>
        </select>
        <label for="deadline">Deadline</label>
        <input type="date" id="deadline" required>
        <button type="submit">+ Add Task</button>
      </form>
    </section>

    <section class="panel">
      <h2>My Study Tasks</h2>
      <div class="filters">
        <input type="search" id="searchInput" placeholder="Search tasks..." aria-label="Search tasks">
        <select id="filterStatus" aria-label="Filter by status">
          <option value="all">All Tasks</option><option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="taskList"></div>
    </section>
  </main>

  <footer><p>Student Study Planner | Learn • Plan • Achieve</p></footer>
  <script src="script.js"></script>
</body>
</html>
